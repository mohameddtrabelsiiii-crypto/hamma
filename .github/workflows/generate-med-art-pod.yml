name: Generate Med Art original POD artwork
on:
  push:
    branches: [main]
    paths:
      - "tools/generate_med_art_pod.py"
      - ".github/workflows/generate-med-art-pod.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free drawing dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate original print-ready transparent PNG designs
        run: python tools/generate_med_art_pod.py
      - name: Commit public artwork files for Fourthwall draft integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/med-art/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate original Med Art POD graphics [skip ci]"
            git push
          fi
