name: Verify TaskForge Pages URL
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check HTTPS homepage
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 https://taskforge-ai.pages.dev/ -o /tmp/taskforge-home.html
          grep -q "TaskForge AI" /tmp/taskforge-home.html
          grep -q "Submit your project" /tmp/taskforge-home.html
          if grep -qi "mohameddtrabelsiiii" /tmp/taskforge-home.html; then echo "Personal identifier is exposed"; exit 1; fi
      - name: Verify customer portal status interface
        run: |
          grep -Fq 'id="check-status"' /tmp/taskforge-home.html
          grep -Fq 'Check project status' /tmp/taskforge-home.html
          grep -Fq '/api/status' /tmp/taskforge-home.html
      - name: Verify project tracking and checkout reject anonymous requests
        run: |
          for endpoint in status checkout result; do
            code=$(curl --silent --show-error --max-time 20 -o "/tmp/taskforge-${endpoint}-denied.json" -w "%{http_code}" -H "Content-Type: application/json" -d '{"reference":"TF-1234ABCD"}' "https://taskforge-ai.pages.dev/api/${endpoint}")
            test "$code" = "401"
          done
      - name: Check customer forms reject invalid orders
        run: |
          code=$(curl --silent --show-error --max-time 20 -o /tmp/taskforge-invalid-order.json -w "%{http_code}" -F 'service_slug=nonexistent-service' -F 'customer_name=Test' -F 'customer_email=invalid' -F 'brief=' https://taskforge-ai.pages.dev/api/order)
          test "$code" = "400"
      - name: Check API method guard
        run: |
          code=$(curl --silent --show-error --max-time 20 -o /tmp/taskforge-order-response -w "%{http_code}" https://taskforge-ai.pages.dev/api/order)
          test "$code" = "405"
      - name: Check public discovery and service pages
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 20 https://taskforge-ai.pages.dev/robots.txt -o /tmp/taskforge-robots.txt
          grep -Fq "Sitemap: https://taskforge-ai.pages.dev/sitemap.xml" /tmp/taskforge-robots.txt
          curl --fail --silent --show-error --location --retry 3 --max-time 20 https://taskforge-ai.pages.dev/sitemap.xml -o /tmp/taskforge-sitemap.xml
          for path in pdf-to-excel spreadsheet-cleanup company-list cv-writing; do
            grep -Fq "<loc>https://taskforge-ai.pages.dev/services/${path}</loc>" /tmp/taskforge-sitemap.xml
            curl --fail --silent --show-error --location --retry 3 --max-time 20 "https://taskforge-ai.pages.dev/services/${path}" -o "/tmp/taskforge-service-${path}.html"
            grep -Fq "href=\"https://taskforge-ai.pages.dev/services/${path}\"" "/tmp/taskforge-service-${path}.html"
          done

      - name: Verify live quick CSV buyer quote funnel
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 20 https://taskforge-ai.pages.dev/services/quick-csv-fix -o /tmp/taskforge-quick-csv.html
          grep -Fq 'id="csv-quote"' /tmp/taskforge-quick-csv.html
          grep -Fq 'Request a free scope review' /tmp/taskforge-quick-csv.html
          grep -Fq "fetch('/api/lead'" /tmp/taskforge-quick-csv.html
          grep -Fq '<loc>https://taskforge-ai.pages.dev/services/quick-csv-fix</loc>' /tmp/taskforge-sitemap.xml
          code=$(curl --silent --show-error --max-time 20 -o /tmp/taskforge-invalid-lead.json -w "%{http_code}" -H "Content-Type: application/json" -d '{}' https://taskforge-ai.pages.dev/api/lead)
          test "$code" = "400"
