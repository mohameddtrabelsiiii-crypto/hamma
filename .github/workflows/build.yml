name: Build TaskForge AI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/build-pages.mjs
      - run: node --check dist/_worker.js
      - run: node scripts/build-supabase-portal.mjs
      - run: node --check dist/taskforge-public/index.mjs
      - run: node --test worker.test.mjs supabase/functions/*/*.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://epkhqmhhzwlbxxypywau.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aH8nn2WXrFXIJ3yr1o35Ug_hNyTnpqV
