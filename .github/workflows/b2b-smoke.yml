name: Check TaskForge B2B Automation Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public automation offer page
        run: |
          base="https://taskforge-b2b-preview.taskforge-ai.pages.dev"
          curl --fail --silent --show-error --location --retry 3 --max-time 25 "$base/automation" -o /tmp/taskforge-b2b.html
          grep -Fq "B2B AI Workflow Automation" /tmp/taskforge-b2b.html
          grep -Fq 'id="b2b-lead"' /tmp/taskforge-b2b.html
          grep -Fq "Lead intake &amp; CRM routing" /tmp/taskforge-b2b.html
          grep -Fq "Support inbox triage" /tmp/taskforge-b2b.html
          grep -Fq "/api/lead" /tmp/taskforge-b2b.html
          if grep -qi "mohameddtrabelsiiii" /tmp/taskforge-b2b.html; then echo "Identifying details leaked"; exit 1; fi
      - name: Check branded homepage B2B path
        run: |
          base="https://taskforge-b2b-preview.taskforge-ai.pages.dev"
          curl --fail --silent --show-error --location --max-time 25 "$base/" -o /tmp/taskforge-b2b-home.html
          grep -Fq 'href="/automation"' /tmp/taskforge-b2b-home.html
          curl --fail --silent --show-error --location --max-time 25 "$base/sitemap.xml" -o /tmp/taskforge-b2b-sitemap.xml
          grep -Fq '<loc>https://taskforge-ai.pages.dev/automation</loc>' /tmp/taskforge-b2b-sitemap.xml
      - name: Check B2B lead API validates data and origin
        run: |
          base="https://taskforge-b2b-preview.taskforge-ai.pages.dev"
          invalid='{"name":"Test","email":"not-an-email","company":"Test","need":"x","budget":"USD 2000-10000"}'
          response=$(curl --silent --show-error --max-time 25 -o /tmp/b2b-invalid.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$invalid" "$base/api/lead")
          test "$response" = "400"
          response=$(curl --silent --show-error --max-time 25 -o /tmp/b2b-cross-origin.json -w '%{http_code}' -H 'Content-Type: application/json' -H 'Origin: https://untrusted.example' -d "$invalid" "$base/api/lead")
          test "$response" = "403"
          response=$(curl --silent --show-error --max-time 25 -o /tmp/b2b-get.json -w '%{http_code}' "$base/api/lead")
          test "$response" = "405"
      - name: Verify browser-only lead routing demonstration
        run: |
          base="https://taskforge-b2b-preview.taskforge-ai.pages.dev"
          curl --fail --silent --show-error --max-time 25 "$base/automation/demo" -o /tmp/taskforge-demo.html
          grep -Fq "Lead Routing Demonstration" /tmp/taskforge-demo.html
          grep -Fq "All processing stays in your browser" /tmp/taskforge-demo.html
          grep -Fq "Operations / finance review" /tmp/taskforge-demo.html
          code=$(curl --silent --show-error --max-time 25 -o /tmp/taskforge-demo-rejected -w '%{http_code}' -X POST "$base/automation/demo")
          test "$code" = "405"
          curl --fail --silent --show-error --max-time 25 "$base/sitemap.xml" -o /tmp/taskforge-new-sitemap.xml
          grep -Fq '<loc>https://taskforge-ai.pages.dev/automation/demo</loc>' /tmp/taskforge-new-sitemap.xml
      - name: Check functional LeadOps CSV intake and export page
        run: |
          base="https://taskforge-b2b-preview.taskforge-ai.pages.dev"
          curl --fail --silent --show-error --max-time 25 "$base/automation/leadops" -o /tmp/taskforge-leadops.html
          grep -Fq "LeadOps CSV Pilot" /tmp/taskforge-leadops.html
          grep -Fq "Analyze and route" /tmp/taskforge-leadops.html
          grep -Fq "Export reviewed CSV" /tmp/taskforge-leadops.html
          grep -Fq "Possible duplicate" /tmp/taskforge-leadops.html
          grep -Fq "safeExportCell" /tmp/taskforge-leadops.html
          if grep -qi "mohameddtrabelsiiii" /tmp/taskforge-leadops.html; then echo "Personal identifier exposed"; exit 1; fi
          response=$(curl --silent --show-error --max-time 25 -o /tmp/leadops-denied -w '%{http_code}' -X POST "$base/automation/leadops")
          test "$response" = "405"
          curl --fail --silent --show-error --max-time 25 "$base/sitemap.xml" -o /tmp/taskforge-leadops-sitemap.xml
          grep -Fq '<loc>https://taskforge-ai.pages.dev/automation/leadops</loc>' /tmp/taskforge-leadops-sitemap.xml
      - name: Verify CRM dual-CSV review pilot
        run: |
          base="https://taskforge-b2b-preview.taskforge-ai.pages.dev"
          curl --fail --silent --show-error --location --max-time 30 "$base/automation/crm-cleanup" -o /tmp/taskforge-crm-demo.html
          grep -Fq "CRM List Cleanup Pilot" /tmp/taskforge-crm-demo.html
          grep -Fq "Compare &amp; flag records" /tmp/taskforge-crm-demo.html
          grep -Fq "Download exceptions only" /tmp/taskforge-crm-demo.html
          grep -Fq "Shared address, distinct names" /tmp/taskforge-crm-demo.html
          grep -Fq "connect-src 'none'" /tmp/taskforge-crm-demo.html || curl -sSI "$base/automation/crm-cleanup" | grep -Fq "connect-src 'none'"
          if grep -qi "mohameddtrabelsiiii" /tmp/taskforge-crm-demo.html; then echo "Private identity leaked in public page"; exit 1; fi
          code=$(curl --silent --show-error --max-time 25 -o /tmp/crm-reject -w '%{http_code}' -X POST "$base/automation/crm-cleanup")
          test "$code" = "405"
          curl --fail --silent --show-error --max-time 25 "$base/sitemap.xml" -o /tmp/crm-sitemap.xml
          grep -Fq '<loc>https://taskforge-ai.pages.dev/automation/crm-cleanup</loc>' /tmp/crm-sitemap.xml
